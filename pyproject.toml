[project]
name = "perspective-mcp"
version = "0.1.0"
description = "MCP server turning Yahoo Finance data into Perspective charts, tables and workspaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1,<5",
    "pandas>=2.2",
    "perspective-python>=5.6,<6",
    "pyarrow>=17",
    "pydantic>=2.9",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "yfinance>=1.7",
]

[project.optional-dependencies]
demo = [
    "openai>=1.60",
    "python-dotenv>=1.0",
    "streamlit>=1.66",
]

[project.scripts]
perspective-mcp = "perspective_mcp.server:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
src = [".", "demo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
